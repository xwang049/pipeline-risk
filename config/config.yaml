# Credit Risk Prediction Pipeline Configuration

# LLM Settings (using cost-effective models)
llm:
  provider: "gemini"  # Options: gemini, openai, anthropic
  model: "models/gemini-2.5-flash"  # Gemini 2.5 Flash (免费额度内)
  # Other cost-effective options:
  # model: "gpt-4o-mini"              # OpenAI (~$0.15/1M tokens)
  # model: "claude-3-5-haiku-20241022" # Anthropic (~$1/1M tokens)
  temperature: 0.1
  max_tokens: 8192  # Increased to reduce truncation risk

# Data Sources
data_sources:
  # Financial data
  financial:
    provider: "yahoo"  # Yahoo Finance
    metrics:
      - "debt_to_equity"
      - "current_ratio"
      - "operating_margin"
      - "roe"
      - "free_cash_flow"

  # News sources
  news:
    max_articles: 20
    days_lookback: 7

  # Market data
  market:
    indicators:
      - "price_change_1w"
      - "price_change_1m"
      - "volume_change"
      - "volatility"

# Risk Prediction Settings
prediction:
  # Time-travel for backtesting
  as_of_date: null         # Format: "YYYY-MM-DD" or null for current time
                           # Example: "2026-02-01" - simulate as if today is Feb 1
                           # System will ONLY use data available before this date

  lookback_days: 90        # How many days of history to consider
  prediction_horizon: 7    # Predict risk for next N days
  risk_threshold: 0.6      # Threshold for flagging high risk (0-1)
  top_k_companies: 5       # Number of companies to analyze (keep ≤5 for free tier)

  # Feature weights for risk scoring
  weights:
    financial_metrics: 0.50    # Financial ratios, Z-Score (50%)
    market_signals: 0.35       # Price movements, volatility (35%)
    news_sentiment: 0.15       # News sentiment (15% - reduced, often noise)

# Company Selection (Automatic Mode)
companies:
  # LLM will automatically select high-risk companies based on current market
  # No manual list needed - companies are chosen dynamically

  market: "US"  # Market scope: US, China, or Global

  # Optional: Load specific companies from file if needed
  from_file: null  # Path to CSV with company tickers

# Output Settings
output:
  format: "json"  # json, csv, both
  save_path: "data/results"
  include_explanation: true
  include_confidence: true
